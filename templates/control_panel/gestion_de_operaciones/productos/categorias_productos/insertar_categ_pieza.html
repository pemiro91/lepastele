{% extends  'control_panel/base_admin.html' %}
{% load static %}
{% block submenu-superior %}
    <h1 class="h3 mb-0 text-gray-800">Agregar Categoría de Pieza</h1>
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="">Gestión del Sitio</a></li>
        <li class="breadcrumb-item"><a href="{% url 'piezas' %}">Piezas</a></li>
        <li class="breadcrumb-item active" aria-current="page">Agregar Categoría de Pieza</li>
    </ol>
{% endblock %}
{% block content %}

    <!-- DataTable with Hover -->
    <div class="col-lg-12">
        <div class="card mb-4">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <h6 class="m-0 font-weight-bold text-primary"></h6>

            </div>
            <div class="card-body">
                 <form role="form" method="post">{% csrf_token %}
                        <div class="form-group row">
                            <label for="inputPassword3" class="col-sm-3 col-form-label">Nombre de categoría</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="exampleFormControlInput1"
                                       placeholder="Diamante" name="nombre_categoria">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="inputPassword3" class="col-sm-3 col-form-label">Descripción</label>
                            <div class="col-sm-9">
                                <textarea class="form-control" name="descripcion_categoria" placeholder="Diamante" id="exampleFormControlTextarea1"
                                          rows="3"></textarea>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="inputEmail3" class="col-sm-3 col-form-label">Tipo de Pieza</label>
                            <div class="col-sm-9">
                                <div class="custom-control custom-radio">
                                    <input type="radio" id="customRadio3" value="1" name="tipo_pieza"
                                           class="custom-control-input">
                                    <label class="custom-control-label" for="customRadio3">Joyas</label>
                                </div>
                                <div class="custom-control custom-radio">
                                    <input type="radio" id="customRadio4" checked value="0" name="tipo_pieza"
                                           class="custom-control-input">
                                    <label class="custom-control-label" for="customRadio4">Gemas</label>
                                </div>
                            </div>
                        </div>


                        <div class="form-group row">
                            <div class="col-sm-10">
                                <button type="submit" class="btn btn-primary">Agregar Categoría de Pieza</button>
                            </div>
                        </div>
                    </form>
            </div>
        </div>
    </div>

{% endblock %}
{% block js %}
    <!-- Page level plugins -->
    <script src="{% static 'control_panel/vendor/datatables/jquery.dataTables.min.js' %}"></script>
    <script src="{% static 'control_panel/vendor/datatables/dataTables.bootstrap4.min.js' %}"></script>

    <!-- Page level custom scripts -->
    <script>
        $(document).ready(function () {
            $('#dataTable').DataTable(); // ID From dataTable
            $('#dataTableHover').DataTable(); // ID From dataTable with Hover
        });
    </script>

{% endblock %}
