{% extends  'control_panel/base_admin.html' %}
{% load static %}
{% block submenu-superior %}
    <h1 class="h3 mb-0 text-gray-800">Editar Pieza</h1>
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="">Gestión del sitio</a></li>
        <li class="breadcrumb-item"><a href="{% url 'piezas' %}">Piezas</a></li>
        <li class="breadcrumb-item active" aria-current="page">Editar Pieza</li>
    </ol>
{% endblock %}
{% block content %}

    <!-- DataTable with Hover -->
    <div class="col-lg-12">
        <div class="card mb-4">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <h6 class="m-0 font-weight-bold text-primary"></h6>

            </div>
            <div class="card-body">
                <form>
                    <div class="form-group row">
                        <label for="inputPassword3" class="col-sm-3 col-form-label">Imagen Principal</label>
                        <div class="col-sm-9">
                            <div class="custom-file ">
                                <input multiple="multiple" type="file" class="custom-file-input" id="customFile">
                                <label class="custom-file-label" for="customFile">Seleccione imágenes</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label for="inputEmail3" class="col-sm-3 col-form-label">Seleccionar categoría</label>
                        <div class="col-sm-9">
                            <select class="form-control" id="exampleFormControlSelect1">
                                <option>Anillos de Dama</option>
                                <option>Esmeralda</option>
                                <option>Diamante</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label for="inputPassword3" class="col-sm-3 col-form-label">Número de referencia</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" id="exampleFormControlInput1"
                                   placeholder="315616556" name="numero_referencia">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label for="inputPassword3" class="col-sm-3 col-form-label">Nombre de la pieza</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" id="exampleFormControlInput1"
                                   placeholder="315616556" name="nombre_pieza">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label for="inputPassword3" class="col-sm-3 col-form-label">Descripción de la pieza</label>
                        <div class="col-sm-9">
                            <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label for="inputPassword3" class="col-sm-3 col-form-label">Precio</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" id="exampleFormControlInput1"
                                   placeholder="150" name="precio">
                        </div>
                    </div>


                    <div class="form-group row">
                        <div class="col-sm-10">
                            <button type="submit" class="btn btn-primary">Editar Pieza</button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>

{% endblock %}
{% block js %}
    <!-- Page level plugins -->
    <script src="{% static 'control_panel/vendor/datatables/jquery.dataTables.min.js' %}"></script>
    <script src="{% static 'control_panel/vendor/datatables/dataTables.bootstrap4.min.js' %}"></script>

    <!-- Page level custom scripts -->
    <script>
        $(document).ready(function () {
            $('#dataTable').DataTable(); // ID From dataTable
            $('#dataTableHover').DataTable(); // ID From dataTable with Hover
        });
    </script>

{% endblock %}
