{% extends  'control_panel/base_admin.html' %}
{% load static %}
{% block submenu-superior %}
    <h1 class="h3 mb-0 text-gray-800">Modificar Categoría</h1>
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="">Gestión del Sitio</a></li>
        <li class="breadcrumb-item"><a href="{% url 'productos' %}">Producto</a></li>
        <li class="breadcrumb-item active" aria-current="page">Modificar Categoría</li>
    </ol>
{% endblock %}
{% block content %}

    <!-- DataTable with Hover -->
    <div class="col-lg-12">
        <div class="card mb-4">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <h6 class="m-0 font-weight-bold text-primary"></h6>

            </div>
            <div class="card-body">
                <form role="form" method="post">{% csrf_token %}
                    <div class="form-group row">
                        <label for="inputPassword3" class="col-sm-3 col-form-label">Nombre de categoría</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" value="{{ categoria_producto.nombre_categoria }}"
                                   id="exampleFormControlInput1"
                                   placeholder="Diamante" name="nombre_categoria">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label for="inputPassword3" class="col-sm-3 col-form-label">Descripción</label>
                        <div class="col-sm-9">
                                <textarea class="form-control" name="descripcion_categoria" placeholder="Diamante"
                                          id="exampleFormControlTextarea1"
                                          rows="3">{{ categoria_producto.descripcion }}</textarea>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-sm-10">
                            <button type="submit" class="btn btn-primary">Modificar Categoría</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

{% endblock %}
{% block js %}
    <!-- Page level plugins -->
    <script src="{% static 'control_panel/vendor/datatables/jquery.dataTables.min.js' %}"></script>
    <script src="{% static 'control_panel/vendor/datatables/dataTables.bootstrap4.min.js' %}"></script>

    <!-- Page level custom scripts -->
    <script>
        $(document).ready(function () {
            $('#dataTable').DataTable(); // ID From dataTable
            $('#dataTableHover').DataTable(); // ID From dataTable with Hover
        });
    </script>

{% endblock %}
